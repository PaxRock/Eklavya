    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Russo+One&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        @property --gradient_rotate {
            syntax: "<angle>";
            initial-value: 0deg;
            inherits: false;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --primary-color: #26c485;
            --accent-color: #009e60;
            --dark-bg: #0a0e17;
            --card-bg: rgba(16, 23, 41, 0.85);
            --card-border: rgba(38, 196, 133, 0.3);
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            --text-glow: 0 0 10px rgba(38, 196, 133, 0.8);
            --border-radius: 8px;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            max-height: 100vh;
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            background-color: var(--dark-bg);
            color: #ffffff;
            line-height: 1.6;
            overflow: hidden;
            position: relative;
            justify-content: center;
            align-items: center;
        }

        html {
            overflow: hidden;
            height: 100%;
        }

        /* Enhanced Background with tech texture */
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #000000 0%, #0a0e17 40%, #101729 70%, #162040 100%);
            z-index: -2;
        }

        /* Tech grid lines */
        .tech-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(0, 132, 255, 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 132, 255, 0.15) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
            perspective: 1000px;
            transform-style: preserve-3d;
            animation: gridPulse 10s infinite alternate ease-in-out;
        }

        @keyframes gridPulse {
            0% {
                opacity: 0.3;
                background-size: 50px 50px;
            }

            100% {
                opacity: 0.6;
                background-size: 52px 52px;
            }
        }

        /* Cinematic overlay with film texture */
        .film-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.07'/%3E%3C/svg%3E");
            z-index: -1;
            opacity: 0.6;
            pointer-events: none;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            width: 2px;
            height: 2px;
            opacity: 0.7;
            animation: twinkle 4s infinite ease-in-out;
        }

        @keyframes twinkle {

            0%,
            100% {
                opacity: 0.7;
                transform: scale(1);
            }

            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        .lens-flare {
            position: fixed;
            top: -150px;
            right: -150px;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle at center, rgba(0, 132, 255, 0.5) 0%, rgba(0, 132, 255, 0.2) 20%, transparent 70%);
            z-index: -1;
            opacity: 0.7;
            filter: blur(30px);
            animation: flareMove 20s infinite alternate ease-in-out;
        }

        @keyframes flareMove {
            0% {
                transform: translate(0, 0);
                opacity: 0.3;
            }

            100% {
                transform: translate(-100px, 100px);
                opacity: 0.5;
            }
        }

        @media (prefers-reduced-motion) {

            .star,
            .tech-grid,
            .lens-flare {
                animation: none !important;
            }
        }

        .developer-credit {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            font-family: 'Press Start 2P', cursive;
            font-size: clamp(0.6rem, 1.5vw, 0.8rem);
            color: #ef4444;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.7;
            text-shadow: 0 0 10px rgba(239, 68, 68, 0.4);
            z-index: 1000;
            white-space: nowrap;
            transform: perspective(1000px) rotateX(5deg);
            animation: creditReveal 1s ease-out forwards;
            animation-delay: 1s;
            line-height: 1.4;
        }

        @keyframes creditReveal {
            from {
                opacity: 0;
                transform: perspective(1000px) rotateX(5deg) translateY(20px);
            }

            to {
                opacity: 0.7;
                transform: perspective(1000px) rotateX(5deg) translateY(0);
            }
        }

        /* Refactored Styles */
        .app-container {
            background-color: var(--dark-bg);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: 'Poppins', sans-serif;
        }

        .app-container::selection {
            background-color: var(--primary-color);
            color: white;
        }

        .back-nav {
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background-color: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
            color: #d4d4d4;
            transition: all 300ms;
            z-index: 50;
            text-decoration: none;
        }

        .back-nav:hover {
            border-color: rgba(239, 68, 68, 0.5);
            color: white;
            background-color: rgba(239, 68, 68, 0.1);
        }

        .back-nav svg {
            transition: transform 300ms;
        }

        .back-nav:hover svg {
            transform: translateX(-0.25rem);
        }

        .card-wrapper {
            position: relative;
            width: 100%;
            max-width: 32rem;
            /* max-w-lg */
            margin: 2rem auto;
            padding: 0 1rem;
            z-index: 10;
        }

        .card-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120%;
            height: 80%;
            background-color: rgba(220, 38, 38, 0.2);
            /* ares-600/20 */
            filter: blur(100px);
            border-radius: 9999px;
            z-index: -10;
            pointer-events: none;
        }

        .main-card {
            display: flex;
            flex-direction: column;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(64px);
            /* blur-3xl */
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 1.5rem;
            /* rounded-3xl */
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            /* shadow-2xl */
            overflow: hidden;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.05);
            /* ring-1 */
        }

        .card-header {
            padding: 2.5rem 2rem 1.5rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header-sheen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(239, 68, 68, 0.5), transparent);
        }

        .header-content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .semester-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            margin-bottom: 1rem;
            border-radius: 9999px;
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #f87171;
            /* ares-400 */

            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.1);
        }

        .card-title {
            font-size: 2.25rem;
            font-weight: 700;
            color: white;
            letter-spacing: -0.025em;
            margin-bottom: 0.5rem;
            text-shadow: 0 10px 8px rgba(0, 0, 0, 0.04), 0 4px 3px rgba(0, 0, 0, 0.1);
        }

        @media (min-width: 640px) {
            .card-title {
                font-size: 3rem;
            }
        }

        .highlight-text {
            color: #ef4444;
            /* ares-500 */
        }

        .card-subtitle {
            color: #a3a3a3;
            /* neutral-400 */
            font-size: 0.875rem;
            font-weight: 500;
            letter-spacing: 0.025em;
        }

        .nav-list {
            padding: 0 1rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .nav-link {
            display: block;
            width: 100%;
            text-decoration: none;
            outline: none;
        }

        .nav-item {
            --gradient_rotate: 0deg;
            --border_width: 3px;
            --metal_01: rgb(200 200 220 / 1.0);
            --metal_02: rgb(160 160 180 / 1.0);
            --metal_03: rgb(120 120 140 / 1.0);
            --metal_04: rgb(080 080 100 / 1.0);
            --metal_05: rgb(040 040 060 / 1.0);
            --metal_06: rgb(010 010 010 / 1.0);

            position: relative;
            display: flex;
            align-items: center;
            gap: 1rem;
            width: 100%;
            padding: 1rem;

            border-radius: 1rem;
            transition: all 300ms cubic-bezier(0.25, 0.1, 0.25, 1);

            /* Restored definition */
            background-color: rgba(255, 255, 255, 0.02);
            background-clip: padding-box;
            border: var(--border_width) solid transparent;

            animation: button_gradient_rotate 12s linear infinite;
        }

        .nav-item::before {
            content: "";
            position: absolute;
            inset: calc(-1 * var(--border_width));
            z-index: -1;
            border-radius: inherit;
            padding: var(--border_width);
            background: conic-gradient(from var(--gradient_rotate),
                    rgb(from var(--metal_01) r g b / 0.5),
                    rgb(from var(--metal_01) r g b / 0.0),
                    rgb(from var(--metal_06) r g b / 0.0),
                    rgb(from var(--metal_06) r g b / 1.0),
                    rgb(from var(--metal_04) r g b / 0.5),
                    rgb(from var(--metal_04) r g b / 0.0),
                    rgb(from var(--metal_04) r g b / 1.0),
                    rgb(from var(--metal_01) r g b / 0.5)) border-box;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .nav-link:hover .nav-item {
            background-color: rgba(255, 255, 255, 0.08);
            /* Restored */
            border-color: transparent;
            transform: scale(1.02);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }

        .nav-link:focus-visible .nav-item {
            box-shadow: 0 0 0 2px #ef4444;
        }

        .nav-icon {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 3rem;
            height: 3rem;
            border-radius: 0.75rem;
            /* rounded-xl */
            background-color: #18181b;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #a3a3a3;
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.06);
            transition: all 300ms;
        }

        .nav-link:hover .nav-icon {
            background-color: #ef4444;
            border-color: #f87171;
            color: white;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
            transform: rotate(3deg);
        }

        .nav-content {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .nav-title {
            color: white;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            line-height: 1.25;
            transition: color 300ms;
        }

        .nav-desc {
            color: #737373;
            /* neutral-500 */
            font-size: 0.75rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 0.25rem;
            transition: color 300ms;
        }

        .nav-link:hover .nav-desc {
            color: #d4d4d4;
        }

        .nav-chevron {
            width: 2rem;
            height: 2rem;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #525252;
            /* neutral-600 */
            transition: all 300ms;
        }

        .nav-link:hover .nav-chevron {
            color: white;
            background-color: rgba(255, 255, 255, 0.1);
            transform: translateX(0.25rem);
        }
    </style>
    <style>
        @keyframes button_gradient_rotate {
            from {
                --gradient_rotate: 0deg;
            }

            to {

            }
        }
    </style>

    <script>
        // No custom JS needed as background animations are removed
        console.log("Sem 4 page loaded");

        document.addEventListener('DOMContentLoaded', () => {
            // Create stars
            const starsContainer = document.getElementById('stars');
            const isMobile = window.innerWidth < 768;
            const isLandscape = window.innerWidth < 768 && window.innerHeight < window.innerWidth;

            // Adjust star count based on orientation
            let starCount;
            if (isMobile) {
                starCount = isLandscape ? 100 : 65;
            } else {
                starCount = 120;
            }

            const fragment = document.createDocumentFragment();

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                star.style.top = Math.random() * 100 + '%';
                star.style.left = Math.random() * 100 + '%';
                const size = 1 + Math.random() * 2;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.opacity = 0.3 + Math.random() * 0.7;
                star.style.animationDelay = Math.random() * 5 + 's';
                fragment.appendChild(star);
            }

            starsContainer.appendChild(fragment);

            // Handle orientation changes
            window.addEventListener('resize', () => {
                const newIsLandscape = window.innerWidth < 768 && window.innerHeight < window.innerWidth;
                if (newIsLandscape !== isLandscape) {
                    // Clear existing stars
                    starsContainer.innerHTML = '';

                    // Recreate stars with new count
                    const newStarCount = window.innerWidth < 768 ? (newIsLandscape ? 100 : 65) : 120;
                    const newFragment = document.createDocumentFragment();

                    for (let i = 0; i < newStarCount; i++) {
                        const star = document.createElement('div');
                        star.classList.add('star');
                        star.style.top = Math.random() * 100 + '%';
                        star.style.left = Math.random() * 100 + '%';
                        const size = 1 + Math.random() * 2;
                        star.style.width = size + 'px';
                        star.style.height = size + 'px';
                        star.style.opacity = 0.3 + Math.random() * 0.7;
                        star.style.animationDelay = Math.random() * 5 + 's';
                        newFragment.appendChild(star);
                    }

                    starsContainer.appendChild(newFragment);
                }
            });
        });
    </script>
</body>

</html>
