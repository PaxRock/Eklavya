<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semester IV - Project Eklavya</title>
    <link rel="icon" type="image/png" href="/files/logo/logo.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Russo+One&family=Bebas+Neue&family=Press+Start+2P&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #0a84ff;
            --accent-color: #ff3d00;
            --dark-bg: #0a0e17;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            min-height: 100vh;
            max-height: 100vh;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: var(--dark-bg);
            color: #ffffff;
            line-height: 1.6;
            overflow: hidden;
            position: relative;
        }

        html {
            overflow: hidden;
            height: 100%;
        }

        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #000000 0%, #0a0e17 40%, #101729 70%, #162040 100%);
            z-index: -2;
        }

        .tech-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 132, 255, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 132, 255, 0.08) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
            animation: gridPulse 15s infinite alternate ease-in-out;
        }

        .film-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            z-index: -1;
            opacity: 0.3;
            pointer-events: none;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #fff;
            border-radius: 50%;
            opacity: 0.7;
            animation: starGlow 4s infinite alternate;
        }

        .message {
            font-size: clamp(2rem, 6vw, 3.5rem);
            font-family: 'Press Start 2P', cursive;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #b388ff;
            text-align: center;
            margin: 0;
            padding: 0 1rem;
            animation: messageReveal 2s ease-out forwards;
            transform: perspective(1200px) rotateX(20deg);
            line-height: 1.4;
            text-shadow: 
                0 0 20px rgba(179, 136, 255, 0.7),
                0 0 40px rgba(179, 136, 255, 0.5),
                0 0 60px rgba(179, 136, 255, 0.3);
        }

        .loading-dots {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            margin-top: 2rem;
        }

        .dot {
            width: 12px;
            height: 12px;
            background: #b388ff;
            border-radius: 50%;
            animation: dotPulse 1.5s infinite;
        }

        .dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes dotPulse {
            0%, 100% {
                transform: scale(0.5);
                opacity: 0.3;
            }
            50% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes starGlow {
            0% { opacity: 0.4; }
            100% { opacity: 0.9; }
        }

        @keyframes gridPulse {
            0% {
                opacity: 0.2;
                background-size: 50px 50px;
            }
            100% {
                opacity: 0.4;
                background-size: 51px 51px;
            }
        }

        .back-button {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 0.8rem 2rem;
            background: linear-gradient(45deg, #ff3d00, #b71c1c);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            text-decoration: none;
            margin-top: 3rem;
            transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            animation: buttonReveal 1.5s ease-out forwards;
            transform: perspective(800px) rotateX(10deg);
        }

        .back-button:hover {
            transform: perspective(800px) rotateX(10deg) translateY(-3px) scale(1.03);
            background: linear-gradient(45deg, #b71c1c, #ff3d00);
        }

        @keyframes messageReveal {
            0% {
                opacity: 0;
                transform: perspective(1200px) rotateX(40deg) translateY(-30px);
            }
            100% {
                opacity: 1;
                transform: perspective(1200px) rotateX(20deg) translateY(0);
            }
        }

        @keyframes buttonReveal {
            0% {
                opacity: 0;
                transform: perspective(800px) rotateX(30deg) translateY(30px);
            }
            100% {
                opacity: 1;
                transform: perspective(800px) rotateX(10deg) translateY(0);
            }
        }

        @media (max-width: 768px) {
            .message {
                font-size: clamp(1.8rem, 6vw, 3rem);
                padding: 0 0.5rem;
            }
            
            .dot {
                width: 10px;
                height: 10px;
            }
            
            .back-button {
                font-size: 1.2rem;
                padding: 0.6rem 1.5rem;
                margin-top: 2rem;
            }
            
            .developer-credit {
                font-size: clamp(0.5rem, 1.2vw, 0.7rem);
                bottom: 15px;
            }
        }

        /* Orientation-specific styles */
        @media (max-width: 768px) and (orientation: landscape) {
            .message {
                font-size: clamp(1.5rem, 4vw, 2.5rem);
                margin-bottom: 1rem;
            }
            
            .loading-dots {
                margin-top: 1rem;
            }
            
            .dot {
                width: 8px;
                height: 8px;
            }
            
            .back-button {
                margin-top: 1.5rem;
            }
            
            /* Adjust star count for landscape */
            #stars {
                --star-count: 100;
            }
        }

        /* Small height screens */
        @media (max-height: 500px) {
            .message {
                font-size: clamp(1.2rem, 3vw, 2rem);
                margin-bottom: 0.5rem;
            }
            
            .loading-dots {
                margin-top: 0.5rem;
            }
            
            .dot {
                width: 6px;
                height: 6px;
            }
            
            .back-button {
                margin-top: 1rem;
                padding: 0.5rem 1.2rem;
            }
            
            .developer-credit {
                bottom: 5px;
            }
        }

        .coming-soon {
            font-family: 'Press Start 2P', cursive;
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            color: #b388ff;
            text-align: center;
            margin: 2rem 0;
            opacity: 0;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 
                0 0 20px rgba(179, 136, 255, 0.7),
                0 0 40px rgba(179, 136, 255, 0.5),
                0 0 60px rgba(179, 136, 255, 0.3);
            animation: messageReveal 1s ease-out forwards;
            animation-delay: 1s;
            transform: perspective(800px) rotateX(10deg);
            line-height: 1.4;
        }

        .developer-credit {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            font-family: 'Press Start 2P', cursive;
            font-size: clamp(0.6rem, 1.5vw, 0.8rem);
            color: #b388ff;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.7;
            text-shadow: 0 0 10px rgba(179, 136, 255, 0.4);
            z-index: 1000;
            white-space: nowrap;
            transform: perspective(1000px) rotateX(5deg);
            animation: creditReveal 1s ease-out forwards;
            animation-delay: 2s;
            line-height: 1.4;
        }

        @keyframes creditReveal {
            from {
                opacity: 0;
                transform: perspective(1000px) rotateX(5deg) translateY(20px);
            }
            to {
                opacity: 0.7;
                transform: perspective(1000px) rotateX(5deg) translateY(0);
            }
        }
    </style>
</head>
<body>
    <!-- Background elements -->
    <div class="bg-gradient"></div>
    <div class="tech-grid"></div>
    <div class="film-overlay"></div>
    
    <!-- Stars effect -->
    <div class="stars" id="stars"></div>
    
    <!-- Main content -->
    <h1 class="message">You Are Too Late</h1>
    <div class="loading-dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>
    <a href="/index.html" class="back-button">Go Back</a>

    <div class="developer-credit">Developed by Pranav A</div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Create stars
            const starsContainer = document.getElementById('stars');
            const isMobile = window.innerWidth < 768;
            const isLandscape = window.innerWidth < 768 && window.innerHeight < window.innerWidth;
            
            // Adjust star count based on orientation
            let starCount;
            if (isMobile) {
                starCount = isLandscape ? 100 : 65;
            } else {
                starCount = 120;
            }
            
            const fragment = document.createDocumentFragment();
            
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                star.style.top = Math.random() * 100 + '%';
                star.style.left = Math.random() * 100 + '%';
                const size = 1 + Math.random() * 2;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.opacity = 0.3 + Math.random() * 0.7;
                star.style.animationDelay = Math.random() * 5 + 's';
                fragment.appendChild(star);
            }
            
            starsContainer.appendChild(fragment);
            
            // Handle orientation changes
            window.addEventListener('resize', () => {
                const newIsLandscape = window.innerWidth < 768 && window.innerHeight < window.innerWidth;
                if (newIsLandscape !== isLandscape) {
                    // Clear existing stars
                    starsContainer.innerHTML = '';
                    
                    // Recreate stars with new count
                    const newStarCount = window.innerWidth < 768 ? (newIsLandscape ? 100 : 65) : 120;
                    const newFragment = document.createDocumentFragment();
                    
                    for (let i = 0; i < newStarCount; i++) {
                        const star = document.createElement('div');
                        star.classList.add('star');
                        star.style.top = Math.random() * 100 + '%';
                        star.style.left = Math.random() * 100 + '%';
                        const size = 1 + Math.random() * 2;
                        star.style.width = size + 'px';
                        star.style.height = size + 'px';
                        star.style.opacity = 0.3 + Math.random() * 0.7;
                        star.style.animationDelay = Math.random() * 5 + 's';
                        newFragment.appendChild(star);
                    }
                    
                    starsContainer.appendChild(newFragment);
                }
            });
        });
    </script>
</body>
</html>
