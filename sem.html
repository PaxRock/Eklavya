<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semester I - Project Eklavya</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg viewBox='0 0 32 32' xmlns='http://www.w3.org/2000/svg'><defs><linearGradient id='space-bg' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%230a0e17'/><stop offset='100%25' stop-color='%23162040'/></linearGradient><filter id='pixel-perfect'><feFlood flood-color='white' result='bg'/><feBlend in='SourceGraphic' in2='bg' mode='normal'/></filter></defs><circle cx='16' cy='16' r='16' fill='url(%23space-bg)'/><circle cx='6' cy='8' r='0.7' fill='white' opacity='0.8'/><circle cx='9' cy='5' r='0.5' fill='white' opacity='0.7'/><circle cx='24' cy='7' r='0.8' fill='white' opacity='0.9'/><circle cx='21' cy='24' r='0.6' fill='white' opacity='0.8'/><circle cx='5' cy='19' r='0.7' fill='white' opacity='0.7'/><circle cx='27' cy='16' r='0.5' fill='white' opacity='0.6'/><circle cx='25' cy='27' r='0.8' fill='white' opacity='0.8'/><circle cx='12' cy='28' r='0.6' fill='white' opacity='0.7'/><circle cx='16' cy='16' r='12' fill='%23e8f5e9'/><g fill='%234dabf7'><rect x='10' y='8' width='3' height='3'/><rect x='13' y='8' width='3' height='3'/><rect x='16' y='8' width='3' height='3'/><rect x='19' y='8' width='3' height='3'/><rect x='10' y='11' width='3' height='3'/><rect x='10' y='14' width='3' height='3'/><rect x='13' y='14' width='3' height='3'/><rect x='16' y='14' width='3' height='3'/><rect x='10' y='17' width='3' height='3'/><rect x='10' y='20' width='3' height='3'/><rect x='13' y='20' width='3' height='3'/><rect x='16' y='20' width='3' height='3'/><rect x='19' y='20' width='3' height='3'/></g><g transform='translate(24, 4) rotate(15)'><rect x='-1.5' y='-0.5' width='3' height='1' fill='%237986cb'/><rect x='-2' y='-2' width='4' height='1.5' fill='%233949ab'/><rect x='-1' y='0.5' width='2' height='1' fill='%233949ab'/></g><ellipse cx='16' cy='16' rx='14' ry='4' fill='none' stroke='%234dabf7' stroke-width='0.5' opacity='0.3' transform='rotate(15, 16, 16)'/></svg>">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Russo+One&family=Bebas+Neue&family=Press+Start+2P&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --primary-color: #0a84ff;
            --accent-color: #ff3d00;
            --dark-bg: #0a0e17;
            --card-bg: rgba(16, 23, 41, 0.85);
            --card-border: rgba(0, 132, 255, 0.3);
            --text-glow: 0 0 10px rgba(0, 132, 255, 0.8);
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            max-height: 100vh;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: var(--dark-bg);
            color: #ffffff;
            line-height: 1.6;
            overflow: hidden;
            position: relative;
        }

        html {
            overflow: hidden;
            height: 100%;
        }

        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #000000 0%, #0a0e17 40%, #101729 70%, #162040 100%);
            z-index: -2;
        }

        .tech-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 132, 255, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 132, 255, 0.08) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
            animation: gridPulse 15s infinite alternate ease-in-out;
        }

        .film-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            z-index: -1;
            opacity: 0.3;
            pointer-events: none;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #fff;
            border-radius: 50%;
            opacity: 0.7;
            animation: starGlow 4s infinite alternate;
        }

        @keyframes starGlow {
            0% { opacity: 0.4; }
            100% { opacity: 0.9; }
        }

        @keyframes gridPulse {
            0% {
                opacity: 0.2;
                background-size: 50px 50px;
            }
            100% {
                opacity: 0.4;
                background-size: 51px 51px;
            }
        }

        .message {
            font-size: clamp(2rem, 6vw, 3.5rem);
            font-family: 'Press Start 2P', cursive;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #ff3d00;
            text-align: center;
            margin: 0;
            padding: 0 1rem;
            animation: messageReveal 2s ease-out forwards;
            transform: perspective(1200px) rotateX(20deg);
            line-height: 1.4;
            text-shadow: 
                0 0 20px rgba(255, 61, 0, 0.7),
                0 0 40px rgba(255, 61, 0, 0.5),
                0 0 60px rgba(255, 61, 0, 0.3);
        }

        @keyframes messageReveal {
            0% {
                opacity: 0;
                transform: perspective(1200px) rotateX(40deg) translateY(-30px);
            }
            100% {
                opacity: 1;
                transform: perspective(1200px) rotateX(20deg) translateY(0);
            }
        }

        .back-button {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 0.8rem 2rem;
            background: linear-gradient(45deg, #ff3d00, #b71c1c);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            text-decoration: none;
            margin-top: 3rem;
            transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            animation: buttonReveal 1.5s ease-out forwards;
            transform: perspective(800px) rotateX(10deg);
        }

        .back-button:hover {
            transform: perspective(800px) rotateX(10deg) translateY(-3px) scale(1.03);
            background: linear-gradient(45deg, #b71c1c, #ff3d00);
        }

        @keyframes buttonReveal {
            0% {
                opacity: 0;
                transform: perspective(800px) rotateX(30deg) translateY(30px);
            }
            100% {
                opacity: 1;
                transform: perspective(800px) rotateX(10deg) translateY(0);
            }
        }

        @media (max-width: 768px) {
            .message {
                font-size: clamp(3rem, 8vw, 5rem);
                padding: 0 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .message {
                font-size: clamp(2.5rem, 7vw, 4rem);
                padding: 0 1rem;
            }
        }

        /* Developer credit */
        .developer-credit {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            font-family: 'Press Start 2P', cursive;
            font-size: clamp(0.6rem, 1.5vw, 0.8rem);
            color: #ff3d00;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.7;
            text-shadow: 0 0 10px rgba(255, 61, 0, 0.4);
            z-index: 1000;
            white-space: nowrap;
            transform: perspective(1000px) rotateX(5deg);
            animation: creditReveal 1s ease-out forwards;
            animation-delay: 2s;
            line-height: 1.4;
        }

        @keyframes creditReveal {
            from {
                opacity: 0;
                transform: perspective(1000px) rotateX(5deg) translateY(20px);
            }
            to {
                opacity: 0.7;
                transform: perspective(1000px) rotateX(5deg) translateY(0);
            }
        }

        @media (max-height: 500px) {
            .developer-credit {
                bottom: 5px;
            }
        }
    </style>
</head>
<body>
    <!-- Background elements -->
    <div class="bg-gradient"></div>
    <div class="tech-grid"></div>
    <div class="film-overlay"></div>
    
    <!-- Stars effect -->
    <div class="stars" id="stars"></div>
    
    <!-- Main content -->
    <h1 class="message">You Are Too Late</h1>
    <a href="index.html" class="back-button">Go Back</a>

    <div class="developer-credit">Developed by Pranav A</div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Create stars
            const starsContainer = document.getElementById('stars');
            const isMobile = window.innerWidth < 768;
            const isLandscape = window.innerWidth < 768 && window.innerHeight < window.innerWidth;
            
            // Adjust star count based on orientation
            let starCount;
            if (isMobile) {
                starCount = isLandscape ? 100 : 65;
            } else {
                starCount = 120;
            }
            
            const fragment = document.createDocumentFragment();
            
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                star.style.top = Math.random() * 100 + '%';
                star.style.left = Math.random() * 100 + '%';
                const size = 1 + Math.random() * 2;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.opacity = 0.3 + Math.random() * 0.7;
                star.style.animationDelay = Math.random() * 5 + 's';
                fragment.appendChild(star);
            }
            
            starsContainer.appendChild(fragment);
            
            // Handle orientation changes
            window.addEventListener('resize', () => {
                const newIsLandscape = window.innerWidth < 768 && window.innerHeight < window.innerWidth;
                if (newIsLandscape !== isLandscape) {
                    // Clear existing stars
                    starsContainer.innerHTML = '';
                    
                    // Recreate stars with new count
                    const newStarCount = window.innerWidth < 768 ? (newIsLandscape ? 100 : 65) : 120;
                    const newFragment = document.createDocumentFragment();
                    
                    for (let i = 0; i < newStarCount; i++) {
                        const star = document.createElement('div');
                        star.classList.add('star');
                        star.style.top = Math.random() * 100 + '%';
                        star.style.left = Math.random() * 100 + '%';
                        const size = 1 + Math.random() * 2;
                        star.style.width = size + 'px';
                        star.style.height = size + 'px';
                        star.style.opacity = 0.3 + Math.random() * 0.7;
                        star.style.animationDelay = Math.random() * 5 + 's';
                        newFragment.appendChild(star);
                    }
                    
                    starsContainer.appendChild(newFragment);
                }
            });
        });
    </script>
</body>
</html>
