<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com https://cdnjs.cloudflare.com https://cdn.tailwindcss.com blob: data: chrome-extension:; connect-src 'self' https://nyc.cloud.appwrite.io https://*.appwrite.io https://accounts.google.com https://oauth2.googleapis.com https://unpkg.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; frame-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com https://cdn.tailwindcss.com; font-src 'self' https://fonts.gstatic.com https://fonts.googleapis.com data:; img-src 'self' data: https: blob:;">
    <title>Project Eklavya</title>
    <link rel="icon" type="image/png" href="/files/logo/logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="sem2/auth.css">
    <style>
        /* Bringing back the original fonts but loading with display=swap for better performance */
        @import url('https://fonts.googleapis.com/css2?family=Russo+One&family=Bebas+Neue&family=Press+Start+2P&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --primary-color: #0a84ff;
            --accent-color: #ff3d00;
            --dark-bg: #0a0e17;
            --card-bg: rgba(16, 23, 41, 0.85);
            --card-border: rgba(0, 132, 255, 0.3);
            --text-glow: 0 0 10px rgba(0, 132, 255, 0.8);
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            min-height: 100vh;
            max-height: 100vh;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: var(--dark-bg);
            color: #ffffff;
            line-height: 1.6;
            overflow: hidden;
            position: relative;
        }

        html {
            overflow: hidden;
            height: 100%;
        }

        /* Enhanced Background with tech texture - but optimized */
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #000000 0%, #0a0e17 40%, #101729 70%, #162040 100%);
            z-index: -2;
        }

        /* Tech grid lines - optimized with less opacity */
        .tech-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 132, 255, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 132, 255, 0.08) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
            animation: gridPulse 15s infinite alternate ease-in-out;
            will-change: opacity, background-size;
        }

        @keyframes gridPulse {
            0% {
                opacity: 0.2;
                background-size: 50px 50px;
            }
            100% {
                opacity: 0.4;
                background-size: 51px 51px;
            }
        }

        /* Simplified film overlay - less resource intensive */
        .film-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            z-index: -1;
            opacity: 0.3;
            pointer-events: none;
        }

        /* Optimized lens flare effect */
        .lens-flare {
            display: none;
        }

        /* Animated stars - optimized for mobile */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #fff;
            border-radius: 50%;
            opacity: 0.7;
            animation: starGlow 4s infinite alternate;
            will-change: opacity;
        }

        @keyframes starGlow {
            0% {
                opacity: 0.4;
            }
            100% {
                opacity: 0.9;
            }
        }

        /* Simplified shooting stars - fewer but more impactful */
        .shooting-star {
            display: none;
        }

        @keyframes shoot {
            0% {
                display: none;
            }
            100% {
                display: none;
            }
        }

        /* Energy beam effect - simplified */
        .energy-beam {
            display: none;
        }

        /* Restored cinematic title effect */
        .heading-container {
            text-align: center;
            position: relative;
            margin: 0;
            margin-top: 2rem;
            width: 100%;
            transform-style: preserve-3d;
            perspective: 1000px;
        }

        .heading {
            font-size: clamp(3.5rem, 10vw, 7rem);
            font-family: 'Russo One', sans-serif;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #4dabf7;
            position: relative;
            margin: 0;
            padding: 0 1rem;
            animation: titleReveal 2s ease-out forwards;
            transform: perspective(1200px) rotateX(20deg);
            will-change: transform, opacity;
            line-height: 1.2;
            text-shadow: 
                0 0 20px rgba(77, 171, 247, 0.7),
                0 0 40px rgba(77, 171, 247, 0.5),
                0 0 60px rgba(77, 171, 247, 0.3);
        }

        .heading span {
            display: inline;
        }

        @keyframes titleReveal {
            0% {
                opacity: 0;
                transform: perspective(1200px) rotateX(40deg) translateY(-30px);
            }
            100% {
                opacity: 1;
                transform: perspective(1200px) rotateX(20deg) translateY(0);
            }
        }

        /* Remove the gradient background and glow effect */
        .heading::before {
            display: none;
        }

        /* Heading accent line */
        .heading-accent {
            width: 150px;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent-color), transparent);
            margin: 1rem auto;
            position: relative;
        }

        /* Performance optimization for all devices */
        @media (prefers-reduced-motion: reduce) {
            .tech-grid, .lens-flare, .particle, .energy-beam, 
            .hero-element, .heading::before, .heading-accent::before,
            .epic-button::before, .heading, .epic-button {
                animation: none !important;
                transition: none !important;
            }
        }

        /* Epic button for CTA */
        .button-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-top: 0;
            width: 100%;
            perspective: 1000px;
        }

        .buttons-row {
            display: flex;
            gap: 2rem;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            max-width: 1200px;
            margin: 0 auto;
        }

        .epic-button {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(1.2rem, 4vw, 2rem);
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 0.8rem 2rem;
            background: linear-gradient(45deg, #0a84ff, #0b5cb2);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            animation: buttonReveal 1.5s ease-out forwards;
            transform: perspective(800px) rotateX(10deg);
            will-change: transform;
            min-width: 200px;
            text-align: center;
        }

        @keyframes buttonReveal {
            0% {
                opacity: 0;
                transform: perspective(800px) rotateX(30deg) translateY(30px);
            }
            100% {
                opacity: 1;
                transform: perspective(800px) rotateX(10deg) translateY(0);
            }
        }

        .epic-button:hover {
            transform: perspective(800px) rotateX(10deg) translateY(-3px) scale(1.03);
            background: linear-gradient(45deg, #0b5cb2, #0a84ff);
        }

        /* Remove button shimmer effect */
        .epic-button::before {
            display: none;
        }

        /* Remove hero elements CSS */
        .hero-elements {
            display: none;
        }

        .hero-circle {
            display: none;
        }

        .hero-ring {
            display: none;
        }

        @keyframes rotate {
            0% {
                display: none;
            }
            100% {
                display: none;
            }
        }

        /* Remove hero elements media queries */
        @media (max-width: 768px) {
            .heading-container {
                margin-top: -3rem;
            }
            
            .heading {
                font-size: clamp(4rem, 10vw, 6rem);
                letter-spacing: 3px;
                transform: perspective(1200px) rotateX(20deg) scaleY(1.2);
                line-height: 1.1;
                padding: 0 1rem;
                margin: 0;
            }

            .heading span {
                display: block;
                margin-bottom: 0.2em;
            }
        }

        @media (max-width: 480px) {
            .heading-container {
                margin-top: -2.5rem;
            }
            
            .heading {
                font-size: clamp(3.8rem, 9.5vw, 5.5rem);
                letter-spacing: 2px;
                transform: perspective(1200px) rotateX(20deg) scaleY(1.3);
                line-height: 1.1;
                padding: 0 0.8rem;
                margin: 0;
            }

            .heading span {
                display: block;
                margin-bottom: 0.2em;
            }

            .buttons-row {
                gap: 1rem;
            }
            
            .epic-button {
                padding: 0.8rem 2rem;
            }
        }

        @media (min-width: 769px) {
            .buttons-row {
                width: 90%;
                gap: 1.5rem;
            }
            
            .epic-button {
                flex: 0 1 calc(33.333% - 2rem);
                margin-bottom: 1rem;
            }
        }

        /* Developer credit - Minecraft style */
        .developer-credit {
            position: fixed;
            top: 1rem;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Press Start 2P', cursive;
            font-size: 0.7rem;
            color: #aaaaaa;
            text-shadow: 2px 2px #000000;
            z-index: 1000;
            cursor: default;
            padding: 0.5rem 1rem;
            background-color: rgba(0, 0, 0, 0.3);
            border: 2px solid #555555;
            border-radius: 4px;
            white-space: nowrap;
            transition: all 0.3s ease;
        }

        .developer-credit:hover {
            transform: translateX(-50%) scale(1.1);
            color: #ffffff;
            border-color: #888888;
        }

        @media (max-width: 480px) {
            .developer-credit {
                font-size: 0.6rem;
                top: 0.7rem;
                padding: 0.4rem 0.8rem;
            }
        }

        /* Add styles for the subtitle */
        .subtitle {
            font-family: 'Russo One', sans-serif;
            font-size: clamp(1rem, 2.5vw, 1.4rem);
            color: #4dabf7;
            text-align: center;
            margin-top: 3rem;
            margin-bottom: 2rem;
            opacity: 0.85;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(77, 171, 247, 0.4);
            animation: subtitleFade 1.5s ease-out forwards;
            transform: perspective(800px) rotateX(10deg);
        }

        @keyframes subtitleFade {
            0% {
                opacity: 0;
                transform: perspective(800px) rotateX(30deg) translateY(20px);
            }
            100% {
                opacity: 0.85;
                transform: perspective(800px) rotateX(10deg) translateY(0);
            }
        }

        @media (max-width: 480px) {
            .subtitle {
                font-size: clamp(0.9rem, 2.2vw, 1.2rem);
                margin-top: 1.5rem;
                margin-bottom: 1.5rem;
            }
        }
      


        /* Notification Button Styles */
        .notification-container {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 1000;
        }

        .notification-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0a84ff, #0b5cb2);
            color: white !important;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(10, 132, 255, 0.4);
            transition: all 0.3s ease;
            position: relative;
            border: none;
            outline: none;
        }
        
        .notification-btn i {
            color: white !important;
            font-size: 1.2rem;
        }
        
        /* Profile Button Styles (Top Left) */
        .profile-container {
            position: fixed;
            top: 1rem;
            left: 1rem;
            z-index: 1000;
        }

        .profile-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0a84ff, #0b5cb2);
            color: white !important;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(10, 132, 255, 0.4);
            transition: all 0.3s ease;
            position: relative;
            border: none;
            outline: none;
        }
        
        .profile-btn i {
            color: white !important;
            font-size: 1.2rem;
        }

        .profile-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(10, 132, 255, 0.6);
        }
        
        /* Profile Popup Styles */
        .profile-popup {
            position: fixed;
            top: 70px;
            left: 20px;
            width: 300px;
            max-height: 400px;
            background: rgba(16, 23, 41, 0.95);
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 132, 255, 0.3);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            overflow: hidden;
            transform: translateY(-20px);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 1001;
        }

        .profile-popup.active {
            transform: translateY(0);
            opacity: 1;
            visibility: visible;
        }

        .profile-header {
            padding: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .profile-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.5rem;
            color: #4dabf7;
            letter-spacing: 1px;
        }

        .profile-content {
            padding: 20px;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .profile-info-item {
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .profile-info-item:last-child {
            border-bottom: none;
        }
        
        .profile-info-label {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 5px;
        }
        
        .profile-info-value {
            font-size: 1rem;
            color: #ffffff;
            font-weight: 500;
        }
        
        .profile-login-prompt {
            text-align: center;
            padding: 30px 20px;
            color: rgba(255, 255, 255, 0.7);
        }
        
        .profile-login-btn {
            margin-top: 15px;
            padding: 10px 20px;
            background: linear-gradient(135deg, #0a84ff, #0b5cb2);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.1rem;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }
        
        .profile-login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(10, 132, 255, 0.4);
        }
        
        .profile-logout-btn {
            margin-top: 15px;
            padding: 10px 20px;
            background: linear-gradient(135deg, #ff3d00, #d32f2f);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.1rem;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            width: 100%;
        }
        
        .profile-logout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 61, 0, 0.4);
        }

        .notification-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(10, 132, 255, 0.6);
        }

        .notification-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            width: 20px;
            height: 20px;
            background-color: #ff3d00;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 10px;
            font-weight: bold;
            animation: pulse 1.5s infinite;
            display: none;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.2);
            }
            100% {
                transform: scale(1);
            }
        }

        /* Notification Popup Styles */
        .notification-popup {
            position: fixed;
            top: 70px;
            right: 20px;
            width: 350px;
            max-height: 500px;
            background: rgba(16, 23, 41, 0.95);
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 132, 255, 0.3);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            overflow: hidden;
            transform: translateY(-20px);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 1001;
        }

        .notification-popup.active {
            transform: translateY(0);
            opacity: 1;
            visibility: visible;
        }

        .notification-header {
            padding: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .notification-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.5rem;
            color: #4dabf7;
            letter-spacing: 1px;
        }

        .close-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .close-btn:hover {
            color: white;
            transform: rotate(90deg);
        }

        .notification-content {
            max-height: 400px;
            overflow-y: auto;
            padding: 10px;
        }

        .notification-item {
            padding: 12px 15px;
            margin-bottom: 10px;
            background: rgba(0, 132, 255, 0.1);
            border-radius: 8px;
            border-left: 3px solid #0a84ff;
            transition: all 0.2s ease;
        }

        .notification-item:hover {
            background: rgba(0, 132, 255, 0.2);
            transform: translateX(5px);
        }

        .notification-item.unread {
            background: rgba(0, 132, 255, 0.2);
            border-left: 3px solid #ff3d00;
        }

        .notification-message {
            font-size: 0.9rem;
            margin-bottom: 5px;
            color: rgba(255, 255, 255, 0.9);
        }

        .notification-time {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.5);
        }

        .no-notifications {
            padding: 30px;
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            font-style: italic;
        }

        

        
       

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(0, 132, 255, 0.3);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 132, 255, 0.5);
        }

        @media (max-width: 480px) {
            .notification-btn {
            width: 40px;
            height: 40px;
            font-size: 0.9rem;
            }
            .notification-btn i {
                font-size: 1rem;
            }
            .notification-badge {
            width: 16px;
            height: 16px;
            font-size: 8px;
            }
            .notification-popup {
                width: 280px;
                right: 10px;
            }
            .profile-btn {
                width: 40px;
                height: 40px;
            }
            .profile-btn i {
                font-size: 1rem;
            }
            .profile-popup {
                width: 280px;
                left: 10px;
            }
            .notification-header {
                padding: 10px;
        }
            .notification-title {
                font-size: 1.2rem;
            }
            .close-btn {
                font-size: 1rem;
            }
            .notification-item {
                padding: 10px 12px;
            }
            .notification-message {
                font-size: 0.8rem;
            }
            .notification-time {
                font-size: 0.6rem;
            }
            .no-notifications {
                padding: 20px;
                font-size: 0.8rem;
            }
            .notification-container {
                top: 0.5rem;
                right: 0.7rem;
            }

            .notification-btn {
                transform-origin: center;
            }

            .notification-btn:hover {
                transform: scale(1.1);
            }

            .notification-popup {
                right: 10px;
                transform: translateY(-20px);
            }

            .notification-popup.active {
                transform: translateY(0);
            }

        }

        
    </style>
</head>
<body>
    <!-- Developer credit -->
    <a href="/tetris/tetris.html" id="secretLink" class="developer-credit">By Pranav Anuvadia</a>

    <!-- Authentication helpers (hidden, controlled by JS) -->
    <div id="userInfo"></div>
    <button id="loginBtn" type="button" onclick="authSystem.showLoginModal()">Login / Signup</button>
    <button id="logoutBtn" type="button" onclick="authSystem.logout()">Logout</button>
    
    <!-- Profile Button (Top Left) -->
    <div class="profile-container">
        <button class="profile-btn" id="profileBtn" aria-label="View profile">
            <i class="fas fa-user"></i>
        </button>
    </div>
    
    <!-- Profile Popup -->
    <div class="profile-popup" id="profilePopup">
        <div class="profile-header">
            <div class="profile-title">Account</div>
            <button class="close-btn" id="closeProfilePopup">&times;</button>
        </div>
        <div class="profile-content" id="profileContent">
            <!-- Profile info will be added here dynamically -->
        </div>
    </div>

    <div id="loginModal">
        <div class="login-modal-content">
            <button class="close-modal" type="button" onclick="authSystem.hideLoginModal()">&times;</button>
            <h2>Access Required</h2>
            <p>Please sign in or create an account to explore Project Eklavya.</p>
            <button id="btn-siwg" type="button" onclick="authSystem.loginWithGoogle()">

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Dynamic title effect
            const heading = document.querySelector('.heading');
            heading.setAttribute('data-text', heading.textContent);
            
            // Create stars with better performance
            const starsContainer = document.getElementById('stars');
            
            // Detect if we're on mobile for performance optimization
            const isMobile = window.innerWidth < 768;
            const starCount = isMobile ? 65 : 120;
            
            // Use document fragment for better performance
            const fragment = document.createDocumentFragment();
            
            // Create regular stars
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                star.style.top = Math.random() * 100 + '%';
                star.style.left = Math.random() * 100 + '%';
                // Vary size for more natural look
                const size = 1 + Math.random() * 2;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.opacity = 0.3 + Math.random() * 0.7;
                // Stagger animations
                star.style.animationDelay = Math.random() * 5 + 's';
                fragment.appendChild(star);
            }
            
            starsContainer.appendChild(fragment);

           
  let clickCount = 0;

  document.getElementById("secretLink").addEventListener("click", function (event) {
    event.preventDefault(); // Stop the default link behavior

    clickCount++;

    if (clickCount === 7) {
      window.location.href = "/tetris/tetris.html";
    }
  });


            
            // Notification System
            const notificationBtn = document.getElementById('notificationBtn');
            const notificationBadge = document.getElementById('notificationBadge');
            const notificationPopup = document.getElementById('notificationPopup');
            const notificationContent = document.getElementById('notificationContent');
            const closePopup = document.getElementById('closePopup');
            
            // Define your notifications directly in the code
            let notifications = [
                {
                    id: 1,
                    message: "Welcome to Project Eklavya! Start exploring now.",
                    //time: "1 week ago",
                    read: true
                 }
                ,
                {
                     id: 2,
                    message: " Third semester is available. Check it out!",
                     //time: "3 days ago",
                     read: false
                }
                 ,
                {
                    id: 3,
                    message: " Every Qb answers are available. Check them out!",
                    //time: "3 days ago",
                    read: false
                },
                

            ];
            
            // Track unread notifications
            let unreadCount = notifications.filter(n => !n.read).length;
            
            // Initialize notification system
            function initNotifications() {
                updateBadge();
                renderNotifications();
            }
            
            // Update badge count
            function updateBadge() {
                unreadCount = notifications.filter(n => !n.read).length;
                if (unreadCount > 0) {
                    notificationBadge.style.display = "flex";
                    notificationBadge.textContent = unreadCount;
                } else {
                    notificationBadge.style.display = "none";
                }
            }
            
            // Render notifications in popup
            function renderNotifications() {
                notificationContent.innerHTML = '';
                
                if (notifications.length === 0) {
                    notificationContent.innerHTML = '<div class="no-notifications">No messages here</div>';
                    return;
                }
                
                notifications.forEach(notification => {
                    const notificationElement = document.createElement('div');
                    notificationElement.className = `notification-item ${notification.read ? '' : 'unread'}`;
                    notificationElement.innerHTML = `
                        <div class="notification-message">${notification.message}</div>
                        
                    `;//div class="notification-time">${notification.time}</div> you can add time if needed
                    
                    // Mark as read when clicked
                    notificationElement.addEventListener('click', () => {
                        if (!notification.read) {
                            notification.read = true;
                            notificationElement.classList.remove('unread');
                            updateBadge();
                        }
                    });
                    
                    notificationContent.appendChild(notificationElement);
                });
            }
            
            // Event listeners
            notificationBtn.addEventListener('click', () => {
                notificationPopup.classList.toggle('active');
                
                // Mark all as read when opening
                if (notificationPopup.classList.contains('active')) {
                    notifications = notifications.map(n => ({...n, read: true}));
                    updateBadge();
                    renderNotifications();
                }
            });
            
            closePopup.addEventListener('click', () => {
                notificationPopup.classList.remove('active');
            });
            
            // Close popup when clicking outside
            document.addEventListener('click', (e) => {
                if (!notificationPopup.contains(e.target) && 
                    !notificationBtn.contains(e.target) &&
                    notificationPopup.classList.contains('active')) {
                    notificationPopup.classList.remove('active');
                }
            });
            
            // Profile Button System
            const profileBtn = document.getElementById('profileBtn');
            const profilePopup = document.getElementById('profilePopup');
            const profileContent = document.getElementById('profileContent');
            const closeProfilePopup = document.getElementById('closeProfilePopup');
            
            // Event listeners for profile button
            if (profileBtn) {
                profileBtn.addEventListener('click', () => {
                    profilePopup.classList.toggle('active');
                });
            }
            
            if (closeProfilePopup) {
                closeProfilePopup.addEventListener('click', () => {
                    profilePopup.classList.remove('active');
                });
            }
            
            // Close profile popup when clicking outside
            document.addEventListener('click', (e) => {
                if (profilePopup && !profilePopup.contains(e.target) && 
                    !profileBtn.contains(e.target) &&
                    profilePopup.classList.contains('active')) {
                    profilePopup.classList.remove('active');
                }
            });

            

            // Add a click event listener to the secret link
            
            // Initialize
            initNotifications();
        });
    </script>
