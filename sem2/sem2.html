<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Semester II - Project Eklavya: Resources">
    <title>Semester II - Project Eklavya</title>
    <link rel="icon" type="image/png" href="/files/logo/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;500;600;700;800&family=Press+Start+2P&family=Russo+One&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --primary-color: #0a84ff;
            --accent-color: #ff3d00;
            --dark-bg: #0a0e17;
            --card-bg: rgba(16, 23, 41, 0.85);
            --card-border: rgba(0, 132, 255, 0.3);
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            --text-glow: 0 0 10px rgba(0, 132, 255, 0.8);
            --border-radius: 8px;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            max-height: 100vh;
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            background-color: var(--dark-bg);
            color: #ffffff;
            line-height: 1.6;
            overflow: hidden;
            position: relative;
            justify-content: center;
            align-items: center;
        }

        html {
            overflow: hidden;
            height: 100%;
        }

        /* Enhanced Background with tech texture */
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #000000 0%, #0a0e17 40%, #101729 70%, #162040 100%);
            z-index: -2;
        }

        /* Tech grid lines */
        .tech-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(0, 132, 255, 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 132, 255, 0.15) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
            perspective: 1000px;
            transform-style: preserve-3d;
            animation: gridPulse 10s infinite alternate ease-in-out;
        }

        @keyframes gridPulse {
            0% {
                opacity: 0.3;
                background-size: 50px 50px;
            }

            100% {
                opacity: 0.6;
                background-size: 52px 52px;
            }
        }

        /* Cinematic overlay with film texture */
        .film-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.07'/%3E%3C/svg%3E");
            z-index: -1;
            opacity: 0.6;
            pointer-events: none;
        }

        /* Stars background */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            width: 2px;
            height: 2px;
            opacity: 0.7;
            animation: twinkle 4s infinite ease-in-out;
        }

        @keyframes twinkle {

            0%,
            100% {
                opacity: 0.7;
                transform: scale(1);
            }

            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        /* Spaceships */
        .spaceship {
            position: absolute;
            width: 30px;
            height: 15px;
            z-index: 1;
            pointer-events: none;
            filter: drop-shadow(0 0 10px rgba(0, 132, 255, 0.8));
            animation: flySpaceship 20s linear infinite;
        }

        @keyframes flySpaceship {
            0% {
                transform: translate(-30px, 0) rotate(0deg);
            }

            100% {
                transform: translate(calc(100vw + 30px), 0) rotate(0deg);
            }
        }

        /* Lens flare effect */
        .lens-flare {
            position: fixed;
            top: -150px;
            right: -150px;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle at center, rgba(0, 132, 255, 0.5) 0%, rgba(0, 132, 255, 0.2) 20%, transparent 70%);
            z-index: -1;
            opacity: 0.7;
            filter: blur(30px);
            animation: flareMove 20s infinite alternate ease-in-out;
        }

        @keyframes flareMove {
            0% {
                transform: translate(0, 0);
                opacity: 0.3;
            }

            100% {
                transform: translate(-100px, 100px);
                opacity: 0.5;
            }
        }

        /* Container styling */
        .container {
            max-width: 900px;
            width: 95%;
            margin: 4rem auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1;
            padding: 3rem 2rem;
            border-radius: 16px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            box-shadow: var(--card-shadow);
            border: 1px solid var(--card-border);
            position: relative;
            overflow: hidden;
            min-height: 600px;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--primary-color), transparent);
            animation: scanline 4s infinite linear;
        }

        @keyframes scanline {
            0% {
                transform: translateY(-100%);
            }

            100% {
                transform: translateY(900px);
            }
        }

        /* Semester badge */
        .semester-badge {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            background: linear-gradient(45deg, var(--primary-color), #0b5cb2);
            color: white;
            padding: 0.6rem 1.2rem;
            border-radius: 30px;
            font-weight: 600;
            font-size: 1rem;
            box-shadow: 0 0 15px rgba(0, 132, 255, 0.5);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Heading styles */
        .heading {
            font-size: 3.5rem;
            font-family: 'Russo One', sans-serif;
            text-transform: uppercase;
            letter-spacing: 6px;
            margin: 3rem 0 3rem 0;
            background: linear-gradient(to bottom, #ffffff, #4dabf7);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            text-shadow: 0 0 20px rgba(0, 132, 255, 0.8);
            position: relative;
            transform: perspective(800px) rotateX(10deg);
        }

        /* Buttons grid */
        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.8rem;
            width: 100%;
            margin-top: 2rem;
        }

        .button-link {
            display: block;
            width: 100%;
            text-decoration: none;
        }

        .button {
            width: 100%;
            height: 100px;
            border: none;
            border-radius: var(--border-radius);
            background: linear-gradient(45deg, rgba(10, 132, 255, 0.8), rgba(11, 92, 178, 0.8));
            color: white;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.8rem;
            letter-spacing: 2px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow:
                0 10px 20px rgba(0, 0, 0, 0.3),
                0 0 0 1px rgba(0, 132, 255, 0.3),
                0 0 15px rgba(0, 132, 255, 0.4) inset;
            transform: perspective(800px) rotateX(10deg);
        }

        .button:hover {
            transform: perspective(800px) rotateX(10deg) translateY(-5px) scale(1.05);
            box-shadow:
                0 15px 30px rgba(0, 0, 0, 0.4),
                0 0 0 2px rgba(0, 132, 255, 0.5),
                0 0 20px rgba(0, 132, 255, 0.6) inset;
            background: linear-gradient(45deg, rgba(11, 92, 178, 0.8), rgba(10, 132, 255, 0.8));
        }

        /* Button energy effect */
        .button::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg,
                    rgba(255, 255, 255, 0) 0%,
                    rgba(255, 255, 255, 0.1) 50%,
                    rgba(255, 255, 255, 0) 100%);
            transform: rotate(45deg);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% {
                top: -150%;
                left: -150%;
            }

            100% {
                top: 50%;
                left: 50%;
            }
        }

        /* Back button */
        .back-button {
            position: absolute;
            top: 1rem;
            left: 1rem;
            padding: 0.7rem 1.5rem;
            background: linear-gradient(45deg, var(--accent-color), #d32f2f);
            color: white;
            border: none;
            border-radius: var(--border-radius);
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.2rem;
            letter-spacing: 1px;
            text-decoration: none;
            box-shadow: 0 5px 15px rgba(255, 61, 0, 0.4);
            transition: all 0.3s ease;
            z-index: 10;
        }

        .back-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255, 61, 0, 0.6);
        }

        /* Enhanced responsiveness */
        @media (max-width: 768px) {
            .heading {
                font-size: 3rem;
                letter-spacing: 4px;
                margin: 2.5rem 0 2.5rem 0;
            }

            .buttons-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 1.8rem;
            }

            .button {
                height: 100px;
                font-size: 1.8rem;
                padding: 0 1rem;
            }

            .container {
                padding: 3rem 1.5rem;
                margin: 3rem auto;
                width: 90%;
                min-height: 550px;
            }

            .semester-badge {
                font-size: 1rem;
                padding: 0.6rem 1.2rem;
                top: 1.2rem;
                right: 1.2rem;
            }

            /* Reduce animations for better performance */
            .star {
                animation-duration: 8s;
            }

            /* Simplify spaceship paths */
            .spaceship {
                animation-duration: 25s;
            }

            .card-container {
                grid-template-columns: 1fr;
                padding: 1.5rem;
                gap: 2rem;
            }

            .developer-credit {
                font-size: clamp(0.5rem, 1.2vw, 0.7rem);
                bottom: 15px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 2.5rem 1.2rem;
                margin: 2.5rem auto;
                width: 92%;
                min-height: 500px;
            }

            .heading {
                font-size: 2.5rem;
                letter-spacing: 3px;
                margin: 2rem 0 2rem 0;
            }

            .buttons-grid {
                gap: 1.2rem;
            }

            .button {
                height: 90px;
                font-size: 1.6rem;
            }

            .back-button {
                padding: 0.6rem 1.2rem;
                font-size: 1.1rem;
            }

            .semester-badge {
                font-size: 0.9rem;
                padding: 0.5rem 1rem;
                top: 1rem;
                right: 1rem;
            }

            /* Further optimize performance */
            .spaceship {
                width: 20px;
                height: 10px;
            }

            /* Reduce grid complexity */
            .tech-grid {
                background-size: 60px 60px;
            }
        }

        /* Performance optimization for all devices */
        @media (prefers-reduced-motion: reduce) {

            .star,
            .spaceship,
            .tech-grid,
            .lens-flare,
            .button::before,
            .container::before {
                animation: none !important;
            }
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--card-shadow);
            overflow: hidden;
            transition: var(--transition);
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            transform-style: preserve-3d;
            min-width: 320px;
            padding: 1.5rem;
        }

        .card-header {
            background: var(--header-gradient);
            color: white;
            padding: 2.2rem;
            text-align: center;
            position: relative;
            overflow: hidden;
            margin: -1.5rem -1.5rem 1.5rem -1.5rem;
        }

        .card-title {
            font-size: 2.4rem;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 800;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
            line-height: 1.2;
        }

        .card-subtitle {
            font-size: 1.3rem;
            opacity: 0.95;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .card-container {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2.5rem;
            padding: 2.5rem;
            max-width: 1800px;
            margin: 0 auto;
            width: 100%;
            align-items: start;
            animation: fadeInUp 1s ease-out;
            position: relative;
            z-index: 2;
        }

        @media (min-width: 1200px) {
            .card-container {
                grid-template-columns: repeat(2, 1fr);
                gap: 3rem;
                padding: 3rem;
            }
        }

        @media (max-width: 768px) {
            .card-container {
                grid-template-columns: 1fr;
                padding: 1.5rem;
                gap: 2rem;
            }
        }

        .developer-credit {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            font-family: 'Press Start 2P', cursive;
            font-size: clamp(0.6rem, 1.5vw, 0.8rem);
            color: #4dabf7;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.7;
            text-shadow: 0 0 10px rgba(105, 226, 240, 0.4);
            z-index: 1000;
            white-space: nowrap;
            transform: perspective(1000px) rotateX(5deg);
            animation: creditReveal 1s ease-out forwards;
            animation-delay: 2s;
            line-height: 1.4;
        }

        @keyframes creditReveal {
            from {
                opacity: 0;
                transform: perspective(1000px) rotateX(5deg) translateY(20px);
            }

            to {
                opacity: 0.7;
                transform: perspective(1000px) rotateX(5deg) translateY(0);
            }
        }
    </style>
</head>

<body>
    <!-- Background elements -->
    <div class="bg-gradient"></div>
    <div class="tech-grid"></div>
    <div class="film-overlay"></div>
    <div class="lens-flare"></div>

    <!-- Stars -->
    <div class="stars" id="stars"></div>

    <!-- Main content -->
    <a href="/index.html" class="back-button">BACK</a>

    <div class="container">
        <div class="semester-badge">Spring 2025</div>
        <h1 class="heading">SEMESTER II</h1>
        <div class="buttons-grid">
            <a href="prc.html" class="button">PRC</a>
            <a href="fsl.html" class="button">FSL</a>
            <a href="amt.html" class="button">AMT</a>
            <a href="bex.html" class="button">BEX</a>
            <a href="fcn.html" class="button">FCN</a>
            <a href="other.html" class="button">OTHER</a>
        </div>
    </div>

    <div class="developer-credit">Developed by Pranav A</div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const starsContainer = document.getElementById('stars');
            let isMobile = window.innerWidth <= 768; // Changed to let for updates

            function createStars() {
                starsContainer.innerHTML = '';
                const starCount = window.innerWidth <= 768 ? 75 : 150;

                const fragment = document.createDocumentFragment();
                for (let i = 0; i < starCount; i++) {
                    const star = document.createElement('div');
                    star.classList.add('star');
                    star.style.top = `${Math.random() * 100}%`;
                    star.style.left = `${Math.random() * 100}%`;
                    const size = 1 + Math.random() * 2;
                    star.style.width = `${size}px`;
                    star.style.height = `${size}px`;
                    star.style.animationDelay = `${Math.random() * 4}s`;
                    star.style.opacity = 0.5 + Math.random() * 0.5;
                    fragment.appendChild(star);
                }
                starsContainer.appendChild(fragment);
            }

            createStars();

            // Debounced resize handler
            let resizeTimeout;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(() => {
                    const newIsMobile = window.innerWidth <= 768;
                    if (newIsMobile !== isMobile) {
                        isMobile = newIsMobile;
                        createStars();
                    }
                }, 250);
            });

            // Spaceships (reuse let isMobile from above, avoid redeclaring if possible or update)
            // But logic below uses isMobile constant previously.
            // I'll skip redeclaring isMobile since I declared it at top of listener.
            // Wait, isMobile is used in loop? 
            // In original code (line 639): const isMobile.
            // I should remove the const declaration below.

            // Create spaceships only on desktop
            const spaceshipCount = isMobile ? 0 : 4; // No spaceships on mobile

            for (let i = 0; i < spaceshipCount; i++) {
                const spaceship = document.createElement('div');
                spaceship.classList.add('spaceship');


                // Position at random heights
                spaceship.style.top = `${10 + Math.random() * 80}%`;

                // Randomize speed
                const duration = 15 + Math.random() * 20;
                spaceship.style.animationDuration = `${duration}s`;

                // Randomize delay
                spaceship.style.animationDelay = `${Math.random() * 10}s`;

                // Randomize opacity
                spaceship.style.opacity = 0.7 + Math.random() * 0.3;

                document.body.appendChild(spaceship);
            }

            // Performance optimization
            const isReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (isReducedMotion) {
                document.body.classList.add('reduced-motion');
            }

            // Detect low-performance devices
            const isLowEnd = navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4;

            if (isLowEnd) {
                // Remove some stars on low-end devices
                const stars = document.querySelectorAll('.star');
                for (let i = 0; i < stars.length; i++) {
                    if (i % 2 === 0) {
                        stars[i].remove();
                    }
                }

                // Remove animations that might cause lag
                document.querySelectorAll('.spaceship').forEach(ship => {
                    if (Math.random() > 0.5) ship.remove();
                });

                // Simplify other animations
                document.documentElement.style.setProperty('--transition', 'none');
            }
        });
    </script>
</body>

</html>
